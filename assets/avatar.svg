<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="46" />
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7e2" />
      <stop offset="50%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d5b4c" />
      <stop offset="100%" stop-color="#6e4034" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f0" />
      <stop offset="100%" stop-color="#ffe8df" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#831843" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background circle with clip -->
  <g clip-path="url(#circleClip)">
    <rect width="100" height="100" fill="url(#bgGrad)" />
    
    <!-- Sparkles/stars in bg -->
    <path d="M22 28l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="#f472b6" opacity="0.6"/>
    <path d="M78 26l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" fill="#ec4899" opacity="0.5"/>
    <circle cx="28" cy="42" r="1.5" fill="#f43f5e" opacity="0.4"/>
    <circle cx="74" cy="40" r="1.5" fill="#a855f7" opacity="0.4"/>

    <!-- Back hair / hair tufts -->
    <path d="M24 50 C 20 62, 22 75, 26 82 C 30 78, 32 70, 32 62 Z" fill="url(#hairGrad)" />
    <path d="M76 50 C 80 62, 78 75, 74 82 C 70 78, 68 70, 68 62 Z" fill="url(#hairGrad)" />

    <!-- Shoulders / Clothes -->
    <path d="M26 95 C 28 82, 38 78, 50 78 C 62 78, 72 82, 74 95 Z" fill="url(#shirtGrad)" />
    <!-- White inner collar -->
    <path d="M42 78 C 45 84, 50 87, 50 87 C 50 87, 55 84, 58 78 Z" fill="#ffffff" />
    <path d="M46 78 L 50 84 L 54 78 Z" fill="#fce7f3" />

    <!-- Neck -->
    <path d="M44 70 L 44 80 C 47 82, 53 82, 56 80 L 56 70 Z" fill="#fcdcd3" />

    <!-- Face base -->
    <ellipse cx="50" cy="56" rx="21" ry="19" fill="url(#skinGrad)" />
    <!-- Ears -->
    <circle cx="29" cy="57" r="4.5" fill="#fed7ce" />
    <circle cx="71" cy="57" r="4.5" fill="#fed7ce" />

    <!-- Blushing cheeks -->
    <ellipse cx="37" cy="62" rx="4.5" ry="2.2" fill="#fb7185" opacity="0.55" />
    <ellipse cx="63" cy="62" rx="4.5" ry="2.2" fill="#fb7185" opacity="0.55" />

    <!-- Eyes -->
    <ellipse cx="39" cy="55" rx="3.5" ry="4.5" fill="#312e81" />
    <ellipse cx="61" cy="55" rx="3.5" ry="4.5" fill="#312e81" />
    <!-- Eye highlights -->
    <circle cx="38" cy="53" r="1.5" fill="#ffffff" />
    <circle cx="40.5" cy="56.5" r="0.8" fill="#ffffff" />
    <circle cx="60" cy="53" r="1.5" fill="#ffffff" />
    <circle cx="62.5" cy="56.5" r="0.8" fill="#ffffff" />
    <!-- Eyelashes -->
    <path d="M35 51 Q 39 48 43 51" stroke="#312e81" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <path d="M57 51 Q 61 48 65 51" stroke="#312e81" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <!-- Eyebrows -->
    <path d="M36 47 Q 39 45 42 46" stroke="#6e4034" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M58 46 Q 61 45 64 47" stroke="#6e4034" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Cute smiling mouth -->
    <path d="M47.5 64.5 Q 50 67 52.5 64.5" stroke="#e11d48" stroke-width="1.3" stroke-linecap="round" fill="none" />

    <!-- Hair front / bangs -->
    <path d="M26 50 C 26 32, 36 24, 50 24 C 64 24, 74 32, 74 50 C 74 53, 72 59, 70 61 C 69 55, 68 47, 66 43 C 64 52, 60 55, 56 46 C 54 55, 48 57, 44 46 C 42 53, 38 56, 34 43 C 32 47, 31 55, 30 61 C 28 59, 26 53, 26 50 Z" fill="url(#hairGrad)" />

    <!-- Hair accessory: Left flower clip -->
    <circle cx="30" cy="38" r="3.2" fill="#fb7185" />
    <circle cx="30" cy="38" r="1.2" fill="#fef08a" />
    <!-- Hair accessory: Right flower clip -->
    <circle cx="70" cy="38" r="3.2" fill="#fb7185" />
    <circle cx="70" cy="38" r="1.2" fill="#fef08a" />
  </g>

  <!-- Outer ring border -->
  <circle cx="50" cy="50" r="47" stroke="#ffffff" stroke-width="3" fill="none" filter="url(#softGlow)" />
  <circle cx="50" cy="50" r="48.5" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1" fill="none" />
</svg>
